  <script id="naga-animation-settings-bootstrap">
  (function(){
    try{
      document.documentElement.classList.add('naga-animation-preflight');
      var base='https://bo.titanx7.com';
      var url=base+'/api/public/animation-settings';
      var store=window.__NAGA_EARLY_API__=window.__NAGA_EARLY_API__||{};
      var key=new URL(url,location.href).toString();
      if(!store[key]){
        var controller=typeof AbortController!=='undefined'?new AbortController():null;
        var timer=controller?setTimeout(function(){try{controller.abort()}catch(_e){}},1800):0;
        store[key]=fetch(key,{cache:'no-store',credentials:'same-origin',signal:controller?controller.signal:undefined})
          .then(function(res){if(!res.ok)throw new Error('API error: '+key);return res.json();})
          .finally(function(){if(timer)clearTimeout(timer);});
      }
    }catch(e){}
  })();
  </script>

<script id="page-loader-watchdog">
(function(){
  var root=document.documentElement,done=false;
  function reveal(){
    if(done)return;done=true;
    root.classList.remove('page-loading','page-leaving');
    root.classList.add('page-loaded');
  }
  window.__NAGA_FORCE_REVEAL__=reveal;
  // Hard safety: presentation/loading APIs must never be able to hold the site forever.
  window.__NAGA_REVEAL_TIMER__=setTimeout(reveal,4000);
  window.addEventListener('pageshow',function(e){if(e&&e.persisted)reveal();},{once:true});
})();
</script>

  <title>Return From Game</title>
  <link rel="stylesheet" href="assets/css/style.css?v=1.1.22">
  <link rel="preconnect" href="https://bo.titanx7.com" crossorigin>

<body>
  <main class="provider-return-page" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
    <div style="max-width:420px;width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:22px;text-align:center;color:#fff;">
      <h2 style="margin:0 0 8px;">Game Closed</h2>
      <p style="opacity:.75;margin:0 0 18px;">Click below to transfer provider balance back to your Main Wallet.</p>
      <button id="providerExitBtn" style="width:100%;height:46px;border:0;border-radius:12px;font-weight:900;background:linear-gradient(135deg,#ffcc33,#ff8a00);">Transfer Back & Return Home</button>
      <p id="providerExitMsg" style="min-height:22px;margin:14px 0 0;color:#ffcc33;font-weight:700;"></p>
    </div>
  </main>
    <script src="assets/js/ui-modal.js?v=1.0.0"></script>
<script src="assets/js/config.js?v=1.0.34"></script>
<script src="assets/js/member-inactivity.js?v=1.0.0"></script>
<script src="assets/js/brand-runtime.js?v=20260821-livechatfix2"></script>
  <script src="assets/js/layout-section-loader.js?v=1.1.25"></script>
  <script src="assets/js/provider-launch.js?v=1.0.19"></script>
  <script>
    (function(){
      const btn = document.getElementById('providerExitBtn');
      const msg = document.getElementById('providerExitMsg');
      let settling = false;

      async function settleAndReturn(){
        if(settling) return;
        settling = true;
        btn.disabled = true;
        btn.textContent = 'Transferring...';
        msg.textContent = 'Returning provider balance to Main Wallet...';
        try{
          if(window.NAGA_PROVIDER_LAUNCH && window.NAGA_PROVIDER_LAUNCH.exitProviderGame){
            await window.NAGA_PROVIDER_LAUNCH.exitProviderGame({transferBackAll:true});
          }
          msg.textContent = 'Transfer completed. Returning home...';
          setTimeout(function(){ location.replace('index.html'); }, 250);
        }catch(e){
          settling = false;
          msg.textContent = e.message || 'Transfer back failed. Please try again.';
          btn.disabled = false;
          btn.textContent = 'Transfer Back & Return Home';
        }
      }

      btn.addEventListener('click', settleAndReturn);
      // Provider return URL normally lands here after the user clicks the provider's
      // Return/Main Menu button. Settle immediately; the button remains as fallback.
      window.addEventListener('load', function(){ setTimeout(settleAndReturn, 100); });
    })();
  </script>
