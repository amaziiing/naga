  <script id="naga-animation-settings-bootstrap">
  (function(){
    try{
      document.documentElement.classList.add('naga-animation-preflight');
      var base='https://bo.titanx7.com';
      var url=base+'/api/public/animation-settings';
      var store=window.__NAGA_EARLY_API__=window.__NAGA_EARLY_API__||{};
      var key=new URL(url,location.href).toString();
      if(!store[key]){
        var controller=typeof AbortController!=='undefined'?new AbortController():null;
        var timer=controller?setTimeout(function(){try{controller.abort()}catch(_e){}},1800):0;
        store[key]=fetch(key,{cache:'no-store',credentials:'same-origin',signal:controller?controller.signal:undefined})
          .then(function(res){if(!res.ok)throw new Error('API error: '+key);return res.json();})
          .finally(function(){if(timer)clearTimeout(timer);});
      }
    }catch(e){}
  })();
  </script>
